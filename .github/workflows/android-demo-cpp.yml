# ---------------------------------------------------------------------------
# CI for the C++ demo (CPP/ — C++ API integration, own JNI bridge).
#
# Toolchain (see gradle/libs.versions.toml + gradle-wrapper.properties):
#   Gradle 9.7.1 | AGP 9.4.x | Kotlin 2.2.20 | compileSdk / targetSdk 37
#   NDK 28.2.13676358 | CMake 3.22.1
#   gradle/gradle-daemon-jvm.properties pins the Gradle daemon to JDK 25, so
#   the runner is set up with JDK 25: Gradle then reuses it instead of
#   auto-provisioning a toolchain from foojay.io at build time. (AGP 9.4 needs
#   JDK 17 or newer - JDK 11, as in the stock Android CI template, fails here.)
#
# The SDK is consumed as a direct AAR file (repo-root SDK/libs/flyingbee/
# FPPDFFramework-10.3.6.aar), which is committed to this repository, so no
# credentials are needed. If you ever remove it from git, restore it from a
# secret before the build step (see the note in the "Check bundled SDK AAR" step).
#
# Native path: the build unpacks the AAR (task unpackFppdfSdk) and links
# libFPPDFFramework.so manually in src/main/cpp/CMakeLists.txt - Prefab is
# deliberately not used. Four ABIs are built, which is why this job gets a
# longer timeout than the Kotlin demo.
# ---------------------------------------------------------------------------

name: Android CI - C++ Demo

on:
  push:
    branches: ["main", "master"]
    paths:
      - "CPP/**"
      - "SDK/**"
      - ".gitattributes"
      - ".github/workflows/android-demo-cpp.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "CPP/**"
      - "SDK/**"
      - ".gitattributes"
      - ".github/workflows/android-demo-cpp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-demo-cpp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CPP

jobs:
  build:
    name: Assemble debug + release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      # No android-actions/setup-android: it runs `sdkmanager "tools"`, a package
      # removed from current cmdline-tools, and dies with exit code 1 on today's
      # runner images. The runner already ships the Android SDK (ANDROID_HOME at
      # /usr/local/lib/android/sdk) with the licenses accepted.
      - name: Install SDK platform, build tools, NDK and CMake
        run: |
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # cmdline-tools lives under a versioned dir (16.0, "latest" is absent).
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; letting AGP auto-download what it needs."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk 37 + AGP 9.4 default build tools; the NDK and CMake
          # versions are the ones pinned in app/build.gradle.kts. Not fatal on
          # failure: AGP auto-downloads whatever is still missing at build time.
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1" || true

      # gradlew is committed with LF endings via .gitattributes; add the exec
      # bit anyway so the build also works from a checkout made on Windows.
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check bundled SDK AAR
        run: |
          if [ ! -f ../../SDK/libs/flyingbee/FPPDFFramework-10.3.6.aar ]; then
            echo "::error::FPPDFFramework-10.3.6.aar is missing from the repo-root SDK/libs/flyingbee/."
            echo "::error::Commit it, or restore it from a secret before this step"
            echo "::error::(e.g. a base64 repo secret decoded into that path)."
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fppdf-demo-cpp-debug
          path: CPP/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fppdf-demo-cpp-release
          path: CPP/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
